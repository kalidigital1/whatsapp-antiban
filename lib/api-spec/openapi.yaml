openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: WhatsApp Recovery IA API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: whatsapp
    description: WhatsApp Cloud API connection and messaging
  - name: storage
    description: Private persistent media storage
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /saved-replies:
    get:
      operationId: listSavedReplies
      tags: [whatsapp]
      summary: List reusable chat highlights
      responses:
        "200":
          description: Saved messages and media
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedReply"
    post:
      operationId: createSavedReply
      tags: [whatsapp]
      summary: Save a reusable message or media highlight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedReplyInput"
      responses:
        "201":
          description: Saved highlight created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedReply"
        "400":
          description: Invalid saved highlight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /saved-replies/{savedReplyId}:
    patch:
      operationId: updateSavedReply
      tags: [whatsapp]
      summary: Update a saved highlight
      parameters:
        - name: savedReplyId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedReplyUpdate"
      responses:
        "200":
          description: Saved highlight updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedReply"
        "404":
          description: Saved highlight not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSavedReply
      tags: [whatsapp]
      summary: Delete a saved highlight
      parameters:
        - name: savedReplyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Saved highlight deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Saved highlight not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations/{conversationId}/saved-replies/{savedReplyId}/send:
    post:
      operationId: sendSavedReply
      tags: [whatsapp]
      summary: Send a saved highlight immediately in a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
        - name: savedReplyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Saved highlight sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Sending failed or the account is disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation or saved highlight not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a private media upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve a private saved media object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Media content streamed
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /connection:
    get:
      operationId: getConnection
      tags: [whatsapp]
      summary: Get the current WhatsApp connection
      responses:
        "200":
          description: Current connection state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionStatus"
    post:
      operationId: connectWhatsApp
      tags: [whatsapp]
      summary: Validate credentials and connect to WhatsApp Cloud API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionInput"
      responses:
        "200":
          description: Connected account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionStatus"
        "400":
          description: Invalid input or Meta API rejected credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: disconnectWhatsApp
      tags: [whatsapp]
      summary: Disconnect the current WhatsApp account
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /evolution/connection:
    get:
      operationId: getEvolutionConnection
      tags: [whatsapp]
      summary: Get the current Evolution API connection
      responses:
        "200":
          description: Evolution API connection and QR status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolutionConnectionStatus"
    post:
      operationId: connectEvolutionWhatsApp
      tags: [whatsapp]
      summary: Create or connect an Evolution API WhatsApp instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvolutionConnectionInput"
      responses:
        "200":
          description: Evolution API instance and QR status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolutionConnectionStatus"
        "400":
          description: Invalid settings or Evolution API rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: disconnectEvolutionWhatsApp
      tags: [whatsapp]
      summary: Disconnect the Evolution API instance from this inbox
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /evolution/profile-picture:
    get:
      operationId: getEvolutionProfilePicture
      tags: [whatsapp]
      summary: Load a WhatsApp profile picture through the connected QR session
      parameters:
        - name: number
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: Profile picture image
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: No profile picture is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: QR Code connection is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid WhatsApp profile identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The profile picture could not be loaded from the provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /evolution/connection/qr:
    post:
      operationId: refreshEvolutionQr
      tags: [whatsapp]
      summary: Refresh the Evolution API QR code
      responses:
        "200":
          description: Updated QR code or connected state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolutionConnectionStatus"
        "400":
          description: Evolution API is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /evolution/profile-name:
    post:
      operationId: updateEvolutionProfileName
      tags: [whatsapp]
      summary: Update the connected WhatsApp profile name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvolutionProfileNameInput"
      responses:
        "200":
          description: Updated WhatsApp profile name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolutionConnectionStatus"
        "400":
          description: Invalid profile name or disconnected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations:
    get:
      operationId: listConversations
      tags: [whatsapp]
      summary: List conversations received through the webhook
      responses:
        "200":
          description: Conversation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
  /dashboard:
    get:
      operationId: getDashboardReport
      tags: [whatsapp]
      summary: Get WhatsApp conversation and campaign analytics
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum: [7d, 30d, 90d]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Dashboard metrics and paginated activity report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardReportResponse"
        "400":
          description: Invalid period or page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/export.csv:
    get:
      operationId: exportDashboardReportCsv
      tags: [whatsapp]
      summary: Export all WhatsApp activity and template dispatches for a period
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum: [7d, 30d, 90d]
      responses:
        "200":
          description: Complete activity report in CSV format
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations/{conversationId}/messages:
    get:
      operationId: listConversationMessages
      tags: [whatsapp]
      summary: List messages for a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: sendConversationMessage
      tags: [whatsapp]
      summary: Send a text message to the contact through WhatsApp Cloud API
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message queued and sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Invalid request or disconnected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations/{conversationId}/contact-profile:
    get:
      operationId: getConversationContactProfile
      tags: [whatsapp]
      summary: Get profile details from the Evolution connection for a conversation contact
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: WhatsApp profile details available from Evolution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationContactProfile"
        "404":
          description: Conversation or contact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Evolution connection is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations/{conversationId}/messages/{messageId}/media:
    get:
      operationId: getConversationMessageMedia
      tags: [whatsapp]
      summary: Load media attached to a WhatsApp message through its provider
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Message media
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Message media not found
  /conversations/{conversationId}/messages/{messageId}/reaction:
    post:
      operationId: sendConversationMessageReaction
      tags: [whatsapp]
      summary: Add or remove a reaction on a WhatsApp message
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageReactionInput"
      responses:
        "200":
          description: Reaction sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Reaction could not be sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations/{conversationId}:
    delete:
      operationId: deleteConversation
      tags: [whatsapp]
      summary: Delete a conversation from the local inbox history
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation deleted from the local inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations/{conversationId}/media:
    post:
      operationId: sendConversationMedia
      tags: [whatsapp]
      summary: Send an image, video, audio, or document to a contact
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MediaInput"
      responses:
        "201":
          description: Media message queued and sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Invalid request or disconnected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations/start:
    post:
      operationId: startConversation
      tags: [whatsapp]
      summary: Start a new conversation with a phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartConversationInput"
      responses:
        "201":
          description: Created conversation and sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartConversationResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contacts:
    get:
      operationId: listContacts
      tags: [whatsapp]
      summary: List WhatsApp leads
      responses:
        "200":
          description: Saved leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [whatsapp]
      summary: Create or update a WhatsApp lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Saved lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: Invalid lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contacts/import:
    post:
      operationId: importContacts
      tags: [whatsapp]
      summary: Import or update WhatsApp contacts from a CSV batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactImportInput"
      responses:
        "200":
          description: Contact import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactImportSummary"
        "400":
          description: Invalid import request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contacts/delete:
    post:
      operationId: deleteContacts
      tags: [whatsapp]
      summary: Remove contacts from the address book while preserving chat history
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/ContactRemovalInput"
      responses:
        "200":
          description: Contact removal summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRemovalResult"
        "400":
          description: Invalid contact list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /templates:
    get:
      operationId: listTemplates
      tags: [whatsapp]
      summary: List manually created WhatsApp message templates
      responses:
        "200":
          description: Manually created templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
    post:
      operationId: createTemplate
      tags: [whatsapp]
      summary: Create a WhatsApp template definition for Meta review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: Created template pending Meta review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          description: Invalid template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /templates/costs:
    get:
      operationId: getTemplateCosts
      tags: [whatsapp]
      summary: Get the configured estimated WhatsApp API cost
      responses:
        "200":
          description: Cost estimate configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateCostSummary"
  /templates/{templateId}/dispatch:
    post:
      operationId: dispatchTemplate
      tags: [whatsapp]
      summary: Send an approved WhatsApp template to multiple recipients
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateDispatchInput"
      responses:
        "201":
          description: Dispatch results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateDispatchResult"
        "400":
          description: Invalid request or disconnected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /templates/dispatches:
    get:
      operationId: listTemplateDispatches
      tags: [whatsapp]
      summary: List recent WhatsApp template dispatches
      responses:
        "200":
          description: Recent dispatch summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateDispatchSummary"
  /templates/dispatches/{dispatchId}:
    get:
      operationId: getTemplateDispatch
      tags: [whatsapp]
      summary: Get a template dispatch with recipient statuses
      parameters:
        - name: dispatchId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dispatch detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateDispatchResult"
        "404":
          description: Dispatch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /webhook:
    get:
      operationId: verifyWebhook
      tags: [whatsapp]
      summary: Verify the Meta webhook subscription
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge string
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: Verification failed
    post:
      operationId: receiveWebhook
      tags: [whatsapp]
      summary: Receive inbound WhatsApp messages and delivery statuses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
      responses:
        "200":
          description: Webhook accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    SavedReply:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        kind:
          type: string
          enum: [text, audio, image, video, document]
        content:
          type: ["string", "null"]
        objectPath:
          type: ["string", "null"]
        mediaMimeType:
          type: ["string", "null"]
        mediaFileName:
          type: ["string", "null"]
        sizeBytes:
          type: ["integer", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, title, kind, content, objectPath, mediaMimeType, mediaFileName, sizeBytes, createdAt, updatedAt]
    SavedReplyInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 64
        kind:
          type: string
          enum: [text, audio, image, video, document]
        content:
          type: string
          maxLength: 10000
        objectPath:
          type: string
          minLength: 1
        mediaMimeType:
          type: string
          minLength: 1
        mediaFileName:
          type: string
          minLength: 1
        sizeBytes:
          type: integer
          minimum: 1
      required: [title, kind]
    SavedReplyUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 64
        content:
          type: string
          maxLength: 10000
      required: [title]
    UploadUrlRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
      required: [name, size, contentType]
    UploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
      required: [uploadURL, objectPath]
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
    PhoneNumber:
      type: object
      properties:
        id:
          type: string
        displayPhoneNumber:
