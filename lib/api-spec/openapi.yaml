openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: WhatsApp Recovery IA API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: whatsapp
    description: WhatsApp Cloud API connection and messaging
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /connection:
    get:
      operationId: getConnection
      tags: [whatsapp]
      summary: Get the current WhatsApp connection
      responses:
        "200":
          description: Current connection state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionStatus"
    post:
      operationId: connectWhatsApp
      tags: [whatsapp]
      summary: Validate credentials and connect to WhatsApp Cloud API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionInput"
      responses:
        "200":
          description: Connected account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionStatus"
        "400":
          description: Invalid input or Meta API rejected credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: disconnectWhatsApp
      tags: [whatsapp]
      summary: Disconnect the current WhatsApp account
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /evolution/connection:
    get:
      operationId: getEvolutionConnection
      tags: [whatsapp]
      summary: Get the current Evolution API connection
      responses:
        "200":
          description: Evolution API connection and QR status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolutionConnectionStatus"
    post:
      operationId: connectEvolutionWhatsApp
      tags: [whatsapp]
      summary: Create or connect an Evolution API WhatsApp instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvolutionConnectionInput"
      responses:
        "200":
          description: Evolution API instance and QR status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolutionConnectionStatus"
        "400":
          description: Invalid settings or Evolution API rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: disconnectEvolutionWhatsApp
      tags: [whatsapp]
      summary: Disconnect the Evolution API instance from this inbox
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /evolution/connection/qr:
    post:
      operationId: refreshEvolutionQr
      tags: [whatsapp]
      summary: Refresh the Evolution API QR code
      responses:
        "200":
          description: Updated QR code or connected state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolutionConnectionStatus"
        "400":
          description: Evolution API is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations:
    get:
      operationId: listConversations
      tags: [whatsapp]
      summary: List conversations received through the webhook
      responses:
        "200":
          description: Conversation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
  /conversations/{conversationId}/messages:
    get:
      operationId: listConversationMessages
      tags: [whatsapp]
      summary: List messages for a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: sendConversationMessage
      tags: [whatsapp]
      summary: Send a text message to the contact through WhatsApp Cloud API
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message queued and sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Invalid request or disconnected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations/{conversationId}:
    delete:
      operationId: deleteConversation
      tags: [whatsapp]
      summary: Delete a conversation from the local inbox history
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation deleted from the local inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations/{conversationId}/media:
    post:
      operationId: sendConversationMedia
      tags: [whatsapp]
      summary: Send an image, video, audio, or document to a contact
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MediaInput"
      responses:
        "201":
          description: Media message queued and sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Invalid request or disconnected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations/start:
    post:
      operationId: startConversation
      tags: [whatsapp]
      summary: Start a new conversation with a phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartConversationInput"
      responses:
        "201":
          description: Created conversation and sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartConversationResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contacts:
    get:
      operationId: listContacts
      tags: [whatsapp]
      summary: List WhatsApp leads
      responses:
        "200":
          description: Saved leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [whatsapp]
      summary: Create or update a WhatsApp lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Saved lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: Invalid lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /templates:
    get:
      operationId: listTemplates
      tags: [whatsapp]
      summary: List manually created WhatsApp message templates
      responses:
        "200":
          description: Manually created templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
    post:
      operationId: createTemplate
      tags: [whatsapp]
      summary: Create a WhatsApp template definition for Meta review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: Created template pending Meta review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          description: Invalid template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /templates/costs:
    get:
      operationId: getTemplateCosts
      tags: [whatsapp]
      summary: Get the configured estimated WhatsApp API cost
      responses:
        "200":
          description: Cost estimate configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateCostSummary"
  /templates/{templateId}/dispatch:
    post:
      operationId: dispatchTemplate
      tags: [whatsapp]
      summary: Send an approved WhatsApp template to multiple recipients
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateDispatchInput"
      responses:
        "201":
          description: Dispatch results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateDispatchResult"
        "400":
          description: Invalid request or disconnected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /templates/dispatches:
    get:
      operationId: listTemplateDispatches
      tags: [whatsapp]
      summary: List recent WhatsApp template dispatches
      responses:
        "200":
          description: Recent dispatch summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateDispatchSummary"
  /templates/dispatches/{dispatchId}:
    get:
      operationId: getTemplateDispatch
      tags: [whatsapp]
      summary: Get a template dispatch with recipient statuses
      parameters:
        - name: dispatchId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dispatch detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateDispatchResult"
        "404":
          description: Dispatch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /webhook:
    get:
      operationId: verifyWebhook
      tags: [whatsapp]
      summary: Verify the Meta webhook subscription
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge string
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: Verification failed
    post:
      operationId: receiveWebhook
      tags: [whatsapp]
      summary: Receive inbound WhatsApp messages and delivery statuses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
      responses:
        "200":
          description: Webhook accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
    PhoneNumber:
      type: object
      properties:
        id:
          type: string
        displayPhoneNumber:
          type: string
        verifiedName:
          type: string
        qualityRating:
          type: string
        profilePictureUrl:
          type: ["string", "null"]
      required: [id, displayPhoneNumber, verifiedName, qualityRating, profilePictureUrl]
    ConnectionInput:
      type: object
      properties:
        accessToken:
          type: string
          minLength: 1
        businessAccountId:
          type: string
          minLength: 1
        phoneNumberId:
          type: string
      required: [accessToken, businessAccountId]
    ConnectionStatus:
      type: object
      properties:
        connected:
          type: boolean
        businessAccountId:
          type: ["string", "null"]
        phoneNumbers:
          type: array
          items:
            $ref: "#/components/schemas/PhoneNumber"
        selectedPhoneNumberId:
          type: ["string", "null"]
        webhookUrl:
          type: string
        webhookVerifyTokenConfigured:
          type: boolean
        webhookVerifyToken:
          type: ["string", "null"]
      required:
        [connected, businessAccountId, phoneNumbers, selectedPhoneNumberId, webhookUrl, webhookVerifyTokenConfigured, webhookVerifyToken]
    EvolutionConnectionInput:
      type: object
      properties:
        serverUrl:
          type: string
          format: uri
          minLength: 1
        apiKey:
          type: string
          minLength: 1
        instanceName:
          type: string
          minLength: 2
          maxLength: 64
      required: [serverUrl, apiKey, instanceName]
    EvolutionConnectionStatus:
      type: object
      properties:
        configured:
          type: boolean
        connected:
          type: boolean
        active:
          type: boolean
        state:
          type: ["string", "null"]
        instanceName:
          type: ["string", "null"]
        phoneNumber:
          type: ["string", "null"]
        profileName:
          type: ["string", "null"]
        qrCode:
          type: ["string", "null"]
      required: [configured, connected, active, state, instanceName, phoneNumber, profileName, qrCode]
    Contact:
      type: object
      properties:
        name:
          type: string
        phoneNumber:
          type: string
      required: [name, phoneNumber]
    ContactInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        phoneNumber:
          type: string
          minLength: 8
      required: [name, phoneNumber]
    Conversation:
      type: object
      properties:
        id:
          type: integer
        contact:
          $ref: "#/components/schemas/Contact"
        lastMessage:
          $ref: "#/components/schemas/ChatMessage"
        unreadCount:
          type: integer
        updatedAt:
          type: string
      required: [id, contact, lastMessage, unreadCount, updatedAt]
    ChatMessage:
      type: object
      properties:
        id:
          type: integer
        direction:
          type: string
          enum: [inbound, outbound]
        content:
          type: string
        messageType:
          type: string
        status:
          type: string
        createdAt:
          type: string
        whatsappMessageId:
          type: ["string", "null"]
      required: [id, direction, content, messageType, status, createdAt, whatsappMessageId]
    MessageInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
      required: [content]
    MediaInput:
      type: object
      properties:
        file:
          type: string
          format: binary
        caption:
          type: string
      required: [file]
    StartConversationInput:
      type: object
      properties:
        phoneNumber:
          type: string
          minLength: 8
        content:
          type: string
          minLength: 1
        templateId:
          type: integer
        variables:
          type: array
          items:
            type: string
        componentParameters:
          type: array
          items:
            $ref: "#/components/schemas/TemplateComponentParameter"
      required: [phoneNumber]
    StartConversationResult:
      type: object
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
        message:
          $ref: "#/components/schemas/ChatMessage"
      required: [conversation, message]
    WebhookPayload:
      type: object
      additionalProperties: true
    Template:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        languageCode:
          type: string
        category:
          type: string
        status:
          type: string
        header:
          type: ["string", "null"]
        body:
          type: string
        footer:
          type: ["string", "null"]
        variables:
          type: array
          items:
            type: string
        components:
          type: array
          items:
            $ref: "#/components/schemas/TemplateComponent"
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, languageCode, category, status, header, body, footer, variables, components, createdAt, updatedAt]
    TemplateButton:
      type: object
      properties:
        type:
          type: string
        text:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
        phoneNumber:
          type: ["string", "null"]
        example:
          type: ["array", "null"]
          items:
            type: string
      required: [type, text, url, phoneNumber, example]
    TemplateComponent:
      type: object
      properties:
        type:
          type: string
        format:
          type: ["string", "null"]
        text:
          type: ["string", "null"]
        example:
          type: ["object", "null"]
          additionalProperties: true
        buttons:
          type: array
          items:
            $ref: "#/components/schemas/TemplateButton"
      required: [type, format, text, example, buttons]
    TemplateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        languageCode:
          type: string
          minLength: 2
        category:
          type: string
          minLength: 1
        status:
          type: string
        header:
          type: ["string", "null"]
        body:
          type: string
          minLength: 1
        footer:
          type: ["string", "null"]
        variables:
          type: array
          items:
            type: string
        components:
          type: array
          items:
            $ref: "#/components/schemas/TemplateComponent"
      required: [name, languageCode, category, body]
    TemplateComponentParameter:
      type: object
      properties:
        component:
          type: string
          enum: [header, body, button]
        parameterType:
          type: string
          enum: [text, image, video, document]
        index:
          type: ["integer", "null"]
        subType:
          type: ["string", "null"]
        value:
          type: string
          minLength: 1
      required: [component, parameterType, index, subType, value]
    TemplateDispatchInput:
      type: object
      properties:
        recipients:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 8
        variables:
          type: array
          items:
            type: string
        componentParameters:
          type: array
          items:
            $ref: "#/components/schemas/TemplateComponentParameter"
        tps:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      required: [recipients]
    TemplateCostSummary:
      type: object
      properties:
        currency:
          type: string
        costPerMessage:
          type: number
        source:
          type: string
        disclaimer:
          type: string
      required: [currency, costPerMessage, source, disclaimer]
    TemplateDispatchRecipient:
      type: object
      properties:
        phoneNumber:
          type: string
        status:
          type: string
          enum: [pending, sent, delivered, read, failed]
        message:
          type: ["string", "null"]
        whatsappMessageId:
          type: ["string", "null"]
        updatedAt:
          type: string
      required: [phoneNumber, status, message, whatsappMessageId, updatedAt]
    TemplateDispatchSummary:
      type: object
      properties:
        id:
          type: integer
        templateId:
          type: integer
        templateName:
          type: string
        languageCode:
          type: string
        status:
          type: string
          enum: [pending, partial, sent, delivered, read, failed]
        recipientsCount:
          type: integer
        sentCount:
          type: integer
        deliveredCount:
          type: integer
        readCount:
          type: integer
        failedCount:
          type: integer
        pendingCount:
          type: integer
        estimatedCost:
          type: number
        currency:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, templateId, templateName, languageCode, status, recipientsCount, sentCount, deliveredCount, readCount, failedCount, pendingCount, estimatedCost, currency, createdAt, updatedAt]
    TemplateDispatchResult:
      type: object
      properties:
        dispatchId:
          type: integer
        template:
          $ref: "#/components/schemas/Template"
        status:
          type: string
          enum: [pending, partial, sent, delivered, read, failed]
        recipientsCount:
          type: integer
        sentCount:
          type: integer
        deliveredCount:
          type: integer
        readCount:
          type: integer
        failedCount:
          type: integer
        pendingCount:
          type: integer
        estimatedCost:
          type: number
        currency:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/TemplateDispatchRecipient"
      required: [dispatchId, template, status, recipientsCount, sentCount, deliveredCount, readCount, failedCount, pendingCount, estimatedCost, currency, results]

